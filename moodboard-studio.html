<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kasa Vaas — Moodboard Studio</title><style>body{margin:0;background:#0e0d0b;color:#f5efe6;font-family:Inter,Arial,sans-serif}main{max-width:1000px;margin:auto;padding:48px 5% 80px}.gold{color:#c9a96e;text-transform:uppercase;letter-spacing:3px;font-size:11px}.title{font-family:Georgia,serif;font-size:48px;font-weight:400;margin:10px 0}.sub{color:#aaa;margin-bottom:28px}.panel{background:#171512;border:1px solid #302a22;padding:25px;margin:20px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;color:#c9a96e;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;margin:0 0 7px}input,textarea,select{width:100%;box-sizing:border-box;padding:12px;background:#0e0d0b;border:1px solid #3a332a;color:#f5efe6}textarea{min-height:100px}.field{margin-bottom:14px}.full{grid-column:1/-1}.btn{padding:12px 18px;border:1px solid #c9a96e;background:#c9a96e;color:#0e0d0b;font-weight:700;cursor:pointer;margin-right:8px}.ghost{background:transparent;color:#e2c99a}.danger{background:transparent;border-color:#9b6258;color:#d9a79d}.hidden{display:none}.status{color:#aaa}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{border:1px solid #302a22;background:#0e0d0b}.card img{width:100%;height:190px;object-fit:cover}.cardbody{padding:14px}.meta{font-size:10px;color:#c9a96e;text-transform:uppercase;letter-spacing:1px}.ctitle{font:24px Georgia,serif;margin:5px 0}.desc{font-size:12px;color:#aaa;line-height:1.5}.preview{max-width:220px;max-height:160px;margin-top:8px}@media(max-width:700px){.grid,.cards{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><main><section id="login" class="panel"><div class="gold">Kasa Vaas</div><h1 class="title">Owner access</h1><p class="sub">Only you can manage the live inspiration collection.</p><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button id="loginBtn" class="btn">Sign In</button><span id="loginStatus" class="status"></span></section><section id="app" class="hidden"><div class="gold">Kasa Vaas / Owner</div><h1 class="title">Moodboard Studio</h1><p class="sub">Publish, edit or remove the real inspirations shown on Kasa Vaas.</p><div class="panel"><h2 id="heading">Add inspiration</h2><form id="form"><div class="grid"><div class="field"><label>Title</label><input id="title" required></div><div class="field"><label>Space</label><select id="space"><option>Residential</option><option>Hospitality</option><option>Commercial</option><option>Speciality</option></select></div><div class="field"><label>Style</label><input id="style"></div><div class="field"><label>Location</label><input id="location"></div><div class="field full"><label>Description</label><textarea id="description"></textarea></div><div class="field full"><label>Image</label><input id="image" type="file" accept="image/*"><img id="preview" class="preview hidden"></div></div><button id="save" class="btn">Publish</button><button id="cancel" type="button" class="btn ghost hidden">Cancel</button><span id="status" class="status"></span></form></div><div class="panel"><h2>Your published inspirations</h2><div id="library" class="cards"></div><p id="empty" class="status"></p></div><button id="logout" class="btn ghost">Log Out</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://dtjnhgcgevlppwkjhqys.supabase.co',K='sb_publishable_KIOBeiAOOiSLS0vxFJTADg_sowEHvSW',E='kashvi.saxenaks@gmail.com',S=supabase.createClient(U,K),$=x=>document.getElementById(x);let edit=null,oldImage='';function show(u){if(u&&u.email.toLowerCase()===E){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}else{$('login').classList.remove('hidden');$('app').classList.add('hidden')}}$('loginBtn').onclick=async()=>{const r=await S.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){$('loginStatus').textContent=r.error.message;return}show(r.data.user)};$('logout').onclick=async()=>{await S.auth.signOut();show(null)};$('image').onchange=()=>{let f=$('image').files[0];if(f){$('preview').src=URL.createObjectURL(f);$('preview').classList.remove('hidden')}};function esc(x){return String(x||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}async function load(){let u=(await S.auth.getUser()).data.user;let r=await S.from('inspirations').select('*').eq('created_by',u.id).order('created_at',{ascending:false});if(r.error){$('empty').textContent=r.error.message;return}$('empty').textContent=r.data.length?'':'No inspirations published yet.';$('library').innerHTML=r.data.map(x=>`<article class="card"><img src="${x.image_url}"><div class="cardbody"><div class="meta">${esc(x.space)}${x.style?' · '+esc(x.style):''}</div><div class="ctitle">${esc(x.title)}</div><div class="desc">${esc(x.description)}</div><button class="btn" onclick="editItem('${x.id}')">Edit</button><button class="btn danger" onclick="delItem('${x.id}')">Delete</button></div></article>`).join('')}window.editItem=async id=>{let r=await S.from('inspirations').select('*').eq('id',id).single();if(r.error){alert(r.error.message);return}let x=r.data;edit=id;oldImage=x.image_url;$('title').value=x.title;$('space').value=x.space;$('style').value=x.style||'';$('location').value=x.location||'';$('description').value=x.description||'';$('image').required=false;$('preview').src=x.image_url;$('preview').classList.remove('hidden');$('heading').textContent='Edit inspiration';$('save').textContent='Save Changes';$('cancel').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})};$('cancel').onclick=()=>reset();function reset(){$('form').reset();$('image').required=false;$('preview').classList.add('hidden');edit=null;oldImage='';$('heading').textContent='Add inspiration';$('save').textContent='Publish';$('cancel').classList.add('hidden')}window.delItem=async id=>{if(!confirm('Delete this inspiration?'))return;let x=(await S.from('inspirations').select('image_url').eq('id',id).single()).data;let marker='/storage/v1/object/public/inspiration/';if(x&&x.image_url.includes(marker))await S.storage.from('inspiration').remove([decodeURIComponent(x.image_url.split(marker)[1])]);let r=await S.from('inspirations').delete().eq('id',id);if(r.error)alert(r.error.message);else load()};$('form').onsubmit=async e=>{e.preventDefault();let u=(await S.auth.getUser()).data.user;if(!u||u.email.toLowerCase()!==E){show(null);return}let f=$('image').files[0],url=oldImage;if(f){let p=crypto.randomUUID()+'-'+f.name.replace(/[^a-z0-9.]+/gi,'-').toLowerCase();let r=await S.storage.from('inspiration').upload(p,f,{contentType:f.type});if(r.error){$('status').textContent=r.error.message;return}url=S.storage.from('inspiration').getPublicUrl(p).data.publicUrl}let payload={title:$('title').value,space:$('space').value,style:$('style').value,location:$('location').value,description:$('description').value,image_url:url};let r=edit?await S.from('inspirations').update(payload).eq('id',edit):await S.from('inspirations').insert({...payload,created_by:u.id});if(r.error){$('status').textContent=r.error.message;return}$('status').textContent='Saved ✓';reset();load()};(async()=>show((await S.auth.getUser()).data.user))();</script></body></html>
