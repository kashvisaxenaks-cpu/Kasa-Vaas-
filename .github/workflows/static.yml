# Simple workflow for deploying static content to Pages
name: Deploy static content to Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Copy Kasa Vaas image assets to site root
        run: |
          cp kasa-vaas/bedroom1.jpg .
          cp kasa-vaas/cafe1.jpg .
          cp kasa-vaas/hero1.jpg .
          cp kasa-vaas/kitchen1.jpg .
          cp kasa-vaas/living1.jpg .
          cp kasa-vaas/office1.jpg .
          cp kasa-vaas/logo.png .
      - name: Add Kasa Vaas scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          for script in ['<script src="space-auth.js"></script>','<script src="live-moodboard.js"></script>']:
              if script not in html:
                  marker='</body>'
                  html=html.replace(marker, script+'\n'+marker, 1) if marker in html else html+'\n'+script
          path.write_text(html,encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5